name: Build Iltizamati APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        run: |
          set -e
          mkdir -p proj/app/src/main/java/com/nexa/iltizamati
          cd proj
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Iltizamati"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.nonTransitiveRClass=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.nexa.iltizamati'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.nexa.iltizamati'
                  minSdk 24
                  targetSdk 34
                  versionCode __VCODE__
                  versionName '1.__VCODE__'
              }
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'nexa-iltizamati-2026'
                      keyAlias 'iltizamati'
                      keyPassword 'nexa-iltizamati-2026'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <application
                  android:label="التزاماتي"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>

          EOF
          cat > app/src/main/java/com/nexa/iltizamati/MainActivity.java <<'EOF'
          package com.nexa.iltizamati;

          import android.app.Activity;
          import android.app.KeyguardManager;
          import android.content.Intent;
          import android.graphics.Color;
          import android.hardware.biometrics.BiometricManager;
          import android.hardware.biometrics.BiometricPrompt;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.CancellationSignal;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              static final String APP_URL = "https://iltizamati.nexa-ps.com/";
              WebView web;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(Color.parseColor("#4c1d95"));
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  web.addJavascriptInterface(new Bio(), "NexaBio");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          String h = u.getHost();
                          if (h != null && h.equals("iltizamati.nexa-ps.com")) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { }
                          return true;
                      }
                  });
                  if (state != null) web.restoreState(state); else web.loadUrl(APP_URL);
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }

              void send(final boolean ok) {
                  runOnUiThread(new Runnable() { public void run() {
                      web.evaluateJavascript("window.__nexaBio&&window.__nexaBio(" + ok + ")", null);
                  }});
              }

              class Bio {
                  @JavascriptInterface
                  public boolean available() {
                      if (Build.VERSION.SDK_INT < 29) return false;
                      KeyguardManager km = (KeyguardManager) getSystemService(KEYGUARD_SERVICE);
                      return km != null && km.isDeviceSecure();
                  }

                  @JavascriptInterface
                  public void authenticate() {
                      runOnUiThread(new Runnable() { public void run() { doAuth(); } });
                  }
              }

              @SuppressWarnings("deprecation")
              void doAuth() {
                  if (Build.VERSION.SDK_INT < 29) { send(false); return; }
                  try {
                      BiometricPrompt.Builder b = new BiometricPrompt.Builder(this)
                              .setTitle("التزاماتي")
                              .setSubtitle("افتح بالبصمة أو قفل الشاشة");
                      if (Build.VERSION.SDK_INT >= 30) {
                          b.setAllowedAuthenticators(BiometricManager.Authenticators.BIOMETRIC_WEAK
                                  | BiometricManager.Authenticators.DEVICE_CREDENTIAL);
                      } else {
                          b.setDeviceCredentialAllowed(true);
                      }
                      b.build().authenticate(new CancellationSignal(), getMainExecutor(),
                              new BiometricPrompt.AuthenticationCallback() {
                                  @Override
                                  public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult r) { send(true); }
                                  @Override
                                  public void onAuthenticationError(int code, CharSequence msg) { send(false); }
                              });
                  } catch (Exception e) {
                      send(false);
                  }
              }
          }

          EOF
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          cp ../icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp ../release.keystore app/release.keystore
          sed -i "s|__VCODE__|$GITHUB_RUN_NUMBER|g" app/build.gradle

      - name: Build
        working-directory: proj
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp proj/app/build/outputs/apk/release/app-release.apk Iltizamati.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: التزاماتي v${{ github.run_number }}
          files: Iltizamati.apk
          make_latest: true
